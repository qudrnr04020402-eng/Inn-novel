<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일: 확대 방지, 노치/세이프 에어리어 사용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>은빛 여우관</title>
  <meta name="theme-color" content="#0d1233">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 타이틀 화면 -->
  <section id="title" class="screen">
    <div class="title-shade"></div>
    <div id="title-cast"></div>
    <div class="title-box">
      <h1 id="title-name"></h1>
      <p id="title-sub"></p>
      <div id="title-names"></div>
      <div class="title-btns">
        <button id="btn-new" class="btn primary" type="button">새 게임</button>
        <div class="btn-row">
          <button id="btn-continue" class="btn" type="button">이어하기</button>
          <button id="btn-title-load" class="btn" type="button">불러오기</button>
        </div>
        <button id="btn-endings" class="btn" type="button">엔딩 목록</button>
      </div>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen hidden">
    <div id="bg"></div>
    <div id="sprites">
      <img class="sprite" data-pos="left" alt="">
      <img class="sprite" data-pos="center" alt="">
      <img class="sprite" data-pos="right" alt="">
    </div>
    <div id="hud">
      <span class="hud-item day"><b id="hud-day"></b></span>
      <span class="hud-item"><i class="coin"></i><b id="hud-gold">0</b><small>G</small></span>
      <span class="hud-item"><i class="star">★</i><b id="hud-rep">0</b></span>
    </div>
    <button id="menu-btn" type="button" aria-label="메뉴">메뉴</button>
    <div id="fx"></div>
    <div id="flash"></div>
    <div id="toasts"></div>
    <div id="choices" class="hidden"></div>
    <div id="dialog" class="hidden">
      <div id="nametag"></div>
      <div id="text"></div>
      <div id="next-mark">▼</div>
    </div>

    <!-- 저녁 영업: 장보기 / 재료 고르기 / 하루 결산 / 밤의 업그레이드 / 메뉴판 / 레시피 발견 -->
    <div id="tv-prog" class="hidden"></div>
    <div id="tavern" class="hidden">
      <!-- 재료 고르기 -->
      <div id="tv-brew" class="hidden">
        <div class="tv-order">
          <div class="tv-order-head"><b id="tv-cust"></b><button id="tv-skip" type="button" class="tv-mini">정중히 거절</button></div>
          <p id="tv-order-text"></p>
        </div>
        <div id="tv-slots"></div>
        <p id="tv-note"></p>
        <div id="tv-ings"></div>
        <div class="tv-actions">
          <button id="tv-clear" class="btn" type="button">비우기</button>
          <button id="tv-board" class="btn" type="button">메뉴판</button>
          <button id="tv-serve" class="btn primary" type="button">내기</button>
        </div>
      </div>
      <!-- 장보기 -->
      <div id="tv-shop" class="tv-full hidden">
        <div class="tv-head"><h2>장보기</h2><span class="tv-gold"><i class="coin"></i><b id="tv-shop-gold">0</b> G</span></div>
        <p id="tv-shop-info" class="tv-info"></p>
        <div id="tv-shop-list"></div>
        <div class="tv-actions">
          <button id="tv-shop-board" class="btn" type="button">메뉴판</button>
          <button id="tv-shop-start" class="btn primary" type="button">영업 시작</button>
        </div>
      </div>
      <!-- 하루 결산 -->
      <div id="tv-sum" class="tv-full hidden">
        <div class="tv-head"><h2>오늘의 결산</h2></div>
        <div id="tv-sum-icons"></div>
        <div id="tv-sum-body"></div>
        <div class="tv-actions"><button id="tv-sum-btn" class="btn primary" type="button">영업 종료</button></div>
      </div>
      <!-- 밤: 여관 업그레이드 -->
      <div id="tv-upg" class="tv-full hidden">
        <div class="tv-head"><h2>여관 손보기</h2><span class="tv-gold"><i class="coin"></i><b id="tv-upg-gold">0</b> G</span></div>
        <p class="tv-info">영업으로 번 돈을 여관에 투자할 수 있어요. 다 사지 못할 수도 있으니 신중하게!</p>
        <div id="tv-upg-list"></div>
        <div class="tv-actions"><button id="tv-upg-next" class="btn primary" type="button">다음 날로</button></div>
      </div>
      <!-- 메뉴판 -->
      <div id="tv-menu" class="tv-full hidden">
        <div class="tv-head"><h2>메뉴판</h2><span id="tv-board-count" class="tv-count"></span></div>
        <div id="tv-board-tags"></div>
        <div id="tv-board-list"></div>
        <div class="tv-actions"><button id="tv-board-close" class="btn primary" type="button">닫기</button></div>
      </div>
      <!-- 레시피 발견 -->
      <div id="tv-found" class="tv-full tv-pop hidden">
        <div class="tv-found-box">
          <div class="tv-found-title">레시피 발견!</div>
          <h3 id="tv-found-name"></h3>
          <div id="tv-found-ing"></div>
          <div id="tv-found-tags"></div>
          <button id="tv-found-btn" class="btn primary" type="button">메뉴판에 추가</button>
        </div>
      </div>
      <div id="tv-stamp" class="hidden"></div>
    </div>
  </section>

  <!-- 일차 전환 카드 (게임 화면 위, 탭하면 진행) -->
  <section id="daycard" class="hidden">
    <div class="card-inner">
      <h2 id="card-title"></h2>
      <p id="card-sub"></p>
      <div id="card-body"></div>
      <p id="card-tip"></p>
      <div class="card-hint">화면을 탭해서 시작</div>
    </div>
  </section>

  <!-- 엔딩 화면 -->
  <section id="ending" class="hidden">
    <div class="ending-panel">
      <div id="ending-label"></div>
      <img id="ending-pic" class="hidden" alt="">
      <h2 id="ending-title"></h2>
      <span id="ending-new" class="hidden">NEW!</span>
      <p id="ending-desc"></p>
      <div id="ending-body"></div>
      <div id="ending-count"></div>
      <button id="ending-btn" class="btn primary" type="button">타이틀로</button>
    </div>
  </section>

  <!-- 엔딩 목록 (타이틀) -->
  <section id="endings" class="overlay hidden">
    <div class="panel tall">
      <h2>엔딩 목록 <small id="endings-count"></small></h2>
      <div id="endings-body"></div>
      <button id="endings-close" class="btn primary" type="button">닫기</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="summary" class="overlay hidden">
    <div class="panel summary-panel">
      <h2 id="summary-title"></h2>
      <div id="summary-body"></div>
      <p id="summary-note"></p>
      <button id="summary-btn" class="btn primary" type="button">타이틀로</button>
    </div>
  </section>

  <!-- 메뉴 -->
  <section id="menu" class="overlay hidden">
    <div class="panel">
      <h2>메뉴</h2>
      <button id="menu-save" class="btn" type="button">저장하기</button>
      <button id="menu-load" class="btn" type="button">불러오기</button>
      <button id="menu-log" class="btn" type="button">백로그 (지난 대사)</button>
      <button id="menu-restart" class="btn" type="button">처음부터</button>
      <button id="menu-title" class="btn" type="button">타이틀로</button>
      <button id="menu-close" class="btn primary" type="button">닫기</button>
    </div>
  </section>

  <!-- 세이브/로드 슬롯 -->
  <section id="slots" class="overlay hidden">
    <div class="panel">
      <h2 id="slots-title"></h2>
      <div id="slot-list"></div>
      <button id="slots-close" class="btn" type="button">닫기</button>
    </div>
  </section>

  <!-- 백로그 -->
  <section id="backlog" class="overlay hidden">
    <div class="panel tall">
      <h2>백로그</h2>
      <div id="backlog-list"></div>
      <button id="backlog-close" class="btn primary" type="button">닫기</button>
    </div>
  </section>

  <!-- 확인 창 -->
  <section id="confirm" class="overlay hidden">
    <div class="panel">
      <p id="confirm-msg"></p>
      <div class="row">
        <button id="confirm-no" class="btn" type="button">아니요</button>
        <button id="confirm-yes" class="btn primary" type="button">네</button>
      </div>
    </div>
  </section>

</div>

<!-- 스토리 데이터 -> 엔진 순서로 로드 (fetch 를 쓰지 않아 file:// 에서도 동작) -->
<script src="story/characters.js"></script>
<script src="story/backgrounds.js"></script>
<script src="story/common.js"></script>
<script src="story/tavern.js"></script>
<script src="story/day1.js"></script>
<script src="story/day2.js"></script>
<script src="story/day3.js"></script>
<script src="story/day4.js"></script>
<script src="story/day5.js"></script>
<script src="story/endings.js"></script>
<script src="js/tavern-core.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
